<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Dark sci-fi background -->
  <rect width="64" height="64" rx="14" fill="#030712" />
  
  <!-- Outer glowing cyber border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.6" filter="url(#glow)" />
  <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M10 18 L10 10 L18 10" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M46 10 L54 10 L54 18" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M10 46 L10 54 L18 54" fill="none" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" />
  <path d="M46 54 L54 54 L54 46" fill="none" stroke="#ff007f" stroke-width="2.5" stroke-linecap="round" />

  <!-- Letter J Sci-fi Logo -->
  <path d="M38 18 L38 38 C38 44 33 47 27 47 C21 47 18 43 18 39" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Top bar of J -->
  <line x1="28" y1="18" x2="44" y2="18" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Glowing Neural Synapse Node -->
  <circle cx="38" cy="18" r="2.5" fill="#ffffff" />
  <circle cx="18" cy="39" r="2" fill="#ff007f" filter="url(#glow)" />
</svg>

